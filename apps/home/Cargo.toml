[package]
name = "home-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true }
leptos_router = { workspace = true }
axum = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
leptos_meta = { workspace = true }
tokio = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { version = "0.3", optional = true }
js-sys = { version = "0.3", optional = true }

# Workspace packages (WASM-safe)
design-system = { workspace = true }
ui = { workspace = true }
config = { workspace = true }

# Workspace domain & application (WASM-safe abstractions)
shared = { workspace = true }
domain = { workspace = true }
application = { workspace = true }
auth = { workspace = true }

# Server-only secondary adapters
infrastructure = { workspace = true, optional = true }
database = { workspace = true, optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:js-sys",
    "web-sys/Window",
    "web-sys/Document",
    "web-sys/Element",
    "web-sys/HtmlElement",
    "web-sys/DomRect",
    "web-sys/Event",
    "web-sys/MouseEvent",
    "web-sys/SubmitEvent",
    "web-sys/HtmlInputElement",
    "web-sys/IntersectionObserver",
    "web-sys/IntersectionObserverEntry",
    "web-sys/IntersectionObserverInit",
    "web-sys/CssStyleDeclaration",
    "web-sys/DomTokenList",
    "web-sys/MediaQueryList",
    "web-sys/Performance",
    "web-sys/NodeList",
    "web-sys/KeyboardEvent",
    "ui/hydrate",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:infrastructure",
    "dep:database",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "ui/ssr",
    "config/server",
]

[package.metadata.leptos]
output-name = "home"
site-root = "target/site/home"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
tailwind-config-file = "tailwind.config.js"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
